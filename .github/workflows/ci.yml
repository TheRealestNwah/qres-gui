name: CI

# Every push and pull request: run the tests and build the release zip on a
# clean Windows machine. main holds the latest released version, and feature
# branches reach it through pull requests, so both are tested. Pushing a v*
# tag also publishes that zip as a GitHub release, with notes from
# CHANGELOG.md.
#
# "Run workflow" in the Actions tab does the same release without a local git:
# give it a tag and what to release, and it creates the tag and publishes. A
# tag made by GITHUB_TOKEN can't start another workflow run, so that path has
# to build and publish in the one run rather than lean on the tag trigger.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release, e.g. v1.3.0"
        required: true
        type: string
      ref:
        description: "Branch or commit to release"
        required: false
        default: main
        type: string

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Test
        run: python -m pytest -q

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $found = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
                     "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe") | Where-Object { Test-Path $_ }
          if (-not $found) { choco install innosetup --no-progress -y }

      - name: Build release zip and installer
        shell: pwsh
        run: ./package.ps1 -Python python -Installer

      # The installer on a clean machine: installs silently, registers in
      # Settings > Apps the way winget expects, and says "in use" (exit 2)
      # rather than failing blindly while QRes GUI runs.
      - name: Try the installer
        shell: pwsh
        run: |
          $setup = (Get-ChildItem release/*-setup.exe).FullName
          $p = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup exited with $($p.ExitCode)" }
          $dest = Join-Path $env:LOCALAPPDATA "Programs\QResGUI"
          if (-not (Test-Path "$dest\QResGUI.exe")) { throw "QResGUI.exe wasn't installed" }
          $entry = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\QResGUI"
          $version = (Select-String -Path qres_gui/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ($entry.DisplayVersion -ne $version -or $entry.Publisher -ne "TheRealestNwah") {
            throw "Settings > Apps entry is wrong: $($entry.DisplayVersion) / $($entry.Publisher)"
          }
          $env:QT_QPA_PLATFORM = "offscreen"
          $gui = Start-Process "$dest\QResGUI.exe" -PassThru
          Start-Sleep 8
          $again = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -Wait -PassThru
          Stop-Process -Id $gui.Id -Force -ErrorAction SilentlyContinue
          if ($again.ExitCode -ne 2) { throw "setup while QRes GUI runs exited with $($again.ExitCode), not 2" }
          Write-Host "Installer OK: $version installed, and exit code 2 while running"

      - uses: actions/upload-artifact@v7
        with:
          name: QResGUI-win64
          path: |
            release/*.zip
            release/*-setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test-and-build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          name: QResGUI-win64
          path: release

      - name: Check the tag matches the version
        shell: pwsh
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $version = (Select-String -Path qres_gui/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG doesn't match version $version" }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart("v")
          ./tools/release-notes.ps1 -Version $version | Set-Content notes.md -Encoding utf8
          $zip = (Get-ChildItem release/*.zip).FullName
          $setup = (Get-ChildItem release/*-setup.exe).FullName
          # A pre-release if the source marks this version unfinished, or it's
          # a 0.x version; otherwise a full ("latest") release.
          $flag = Select-String -Path qres_gui/__init__.py -Pattern '__prerelease__ = (\w+)' | Select-Object -First 1
          $unfinished = [bool]$flag -and $flag.Matches[0].Groups[1].Value -eq "True"
          $kind = if ($unfinished -or [version]$version -lt [version]"1.0.0") { "--prerelease" } else { "--latest" }
          # A pushed tag already exists, so insist on it. A dispatched one is
          # created here from the commit that was just tested and built.
          # The outer @() matters: PowerShell unwraps a one-item array coming
          # out of an if, and splatting the bare string "--verify-tag" hands
          # gh one argument per character.
          $where = @(if ("${{ github.event_name }}" -eq "workflow_dispatch") {
              "--target", "$(git rev-parse HEAD)"
          } else { "--verify-tag" })
          gh release create $env:TAG $zip $setup $kind @where --title "QRes GUI $version" --notes-file notes.md
